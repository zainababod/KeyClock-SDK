name: ci

# Unit tests only — strictly offline. No live API calls.
# This SDK targets C# only. Only the csharp job is active.
# Live API verification is NOT run here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('csharp/Makefile') != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - if: hashFiles('csharp/Makefile') != ''
        run: make -C csharp test
